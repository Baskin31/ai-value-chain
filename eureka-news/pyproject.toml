[project]
name = "eureka-news"
version = "0.1.0"
description = "Personal local news aggregator for Eureka, MO"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "anthropic>=0.34",
    "playwright>=1.45",
]

[project.scripts]
eureka-news = "eureka_news.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eureka_news"]
